{% extends "base.html" %}
{% block title %}Register Volunteer{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:700px">
  <h2 class="fw-bold mb-4"><i class="bi bi-person-plus-fill text-primary me-2"></i>Register a Volunteer</h2>
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <form method="POST">
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Full Name *</label>
            <input type="text" name="name" class="form-control" required/>
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Email *</label>
            <input type="email" name="email" class="form-control" required/>
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Phone</label>
            <input type="tel" name="phone" class="form-control"/>
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">City *</label>
            <input type="text" name="city" class="form-control" required placeholder="e.g. Mumbai"/>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Skills * <small class="text-muted">(comma-separated)</small></label>
            <input type="text" name="skills" class="form-control" required
                   placeholder="e.g. Teaching, Python, First Aid"/>
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Hours available per week</label>
            <input type="number" name="hours_week" class="form-control" value="5" min="1" max="40"/>
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Availability (days) *</label>
            <div class="d-flex flex-wrap gap-2 mt-1">
              {% for day in ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"] %}
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="availability" value="{{ day }}" id="day_{{ day }}"/>
                <label class="form-check-label small" for="day_{{ day }}">{{ day[:3] }}</label>
              </div>
              {% endfor %}
            </div>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Short Bio</label>
            <textarea name="bio" class="form-control" rows="3" placeholder="Tell us about yourself…"></textarea>
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-lg me-1"></i>Register
            </button>
            <a href="/volunteers" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
